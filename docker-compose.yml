version: '3.8'

services:
  # FastAPI ML Serving Layer
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ml_inference_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    depends_on:
      - redis
      - mlflow
    restart: always

  # Redis Request Queue
  redis:
    image: redis:7-alpine
    container_name: ml_inference_redis
    ports:
      - "6379:6379"
    restart: always

  # MLflow Model Registry Tracking Server
  mlflow:
    image: python:3.12-slim
    container_name: ml_inference_mlflow
    command: >
      sh -c "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./models:/app/models
    working_dir: /app
    restart: always

  # Prometheus Telemetry Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: ml_inference_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
    restart: always

  # Grafana Observability Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: ml_inference_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always
