name: ML Inference Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined symbols
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length 127
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Execute Pytest Suite
        run: |
          python -m pytest --tb=short -v

  eval-gated-promotion:
    name: Automated Eval-Gated Model Promotion
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Data Ingestion & Preprocessing Pipeline
        run: |
          python src/data/pipeline.py

      - name: Train Candidate Models & Track Experiments with MLflow
        run: |
          python src/models/trainer.py

      - name: Run Eval-Gated Promotion Gate (ROC-AUC Delta > 0.01)
        run: |
          python src/models/eval_promotion.py --threshold 0.01

      - name: Upload Model Promotion Artifact Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-promotion-report
          path: models/promotion_report.json
